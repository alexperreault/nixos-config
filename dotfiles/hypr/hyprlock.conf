# Symlink to the session's wallpaper, updated by scripts/wallpaper.sh
background {
    monitor =
    path = ~/.local/state/wallpaper
    color = rgb(1e1e2e)
    blur_passes = 3
    blur_size = 8
}

# Time on the upper third line, input on the lower one
label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 120
    color = rgba(255, 255, 255, 0.95)
    position = 0, 16.67%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 10
    outer_color = rgba(255, 255, 255, 0.4)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgb(255, 255, 255)
    font_family = JetBrainsMono Nerd Font
    placeholder_text =
    fade_on_empty = false
    position = 0, -16.67%
    halign = center
    valign = center
}
